<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GlucoDose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
            },
            colors: {
              primary: '#93BFC7', // Muted Teal
              secondary: '#ABE7B2', // Pastel Green
              highlight: '#CBF3BB', // Light Lime
              appBg: '#ECF4E8', // White-Green
              cardBg: '#FFFFFF', // Pure White
              textMain: '#1F2937', // Dark Gray
              textMuted: '#6B7280',
            },
            boxShadow: {
              'soft': '0 10px 40px -10px rgba(147, 191, 199, 0.2)',
              'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)',
            },
            animation: {
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
            },
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #ECF4E8;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom scrollbar hiding */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* PDF Export Styles */
      @media print {
        body {
          background-color: white;
        }
        #root > div { 
          background: white !important; 
          min-height: auto !important;
        }
        main {
          box-shadow: none !important;
          border: none !important;
          margin: 0 !important;
          padding: 0 !important;
          max-width: none !important;
          border-radius: 0 !important;
        }
        nav, .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        /* Ensure charts/tables break nicely */
        .page-break {
          page-break-after: always;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
